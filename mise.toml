[tools]
rust = "1.99.1"
node = "24.22.1"
python = "3.12.16"
uv = "0.13.6"

[tasks.web]
run = "npm --prefix web ci && npm --prefix web run build"

[tasks.build]
depends = ["web"]
run = "cargo build --workspace --bins --locked"

[tasks.check]
run = "bash scripts/check.sh"

[tasks.serve]
depends = ["build"]
run = "cargo run --locked -- --web-dir web/dist"

[tasks.sdk-python]
run = "uv run --project sdk/python python tests/plugin_conformance.py --sdk python"
