[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rstrbot-plugin-sdk"
version = "0.1.0"
description = "Public RstrBot JSON-RPC worker SDK"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
rstrbot-python-loader = "rstrbot_sdk:main"

[tool.hatch.build.targets.wheel]
packages = ["rstrbot_sdk"]
