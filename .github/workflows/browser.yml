name: Browser acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/browser/package-lock.json
      - name: Build the WebUI and run focused state tests
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Build core and adjacent worker executables
        run: cargo build --workspace --bins --locked
      - name: Install the locked browser harness
        working-directory: tests/browser
        run: npm ci
      - name: Install the Playwright-pinned Chromium headless shell
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Exercise a disposable local instance
        run: node tests/browser/verify_ui.mjs --binary target/debug/rstrbot --evidence-dir test-results/browser
      - name: Exercise real WebAuthn ceremonies and account security controls
        run: node tests/browser/verify_security.mjs --binary target/debug/rstrbot --evidence-dir test-results/security
      - name: Verify the extracted Linux preview outside the source checkout
        shell: bash
        run: |
          python3 scripts/package.py --profile debug --output-dir artifacts/package
          packages=(artifacts/package/RstrBot-*-linux-*-debug.zip)
          test "${#packages[@]}" -eq 1
          python3 scripts/verify_package.py "${packages[0]}" --output test-results/package-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-browser-acceptance
          path: |
            test-results/browser/
            test-results/security/
            test-results/package-verification.json
            artifacts/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debug-development-preview
          path: artifacts/package/
          if-no-files-found: error
