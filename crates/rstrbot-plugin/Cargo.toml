[package]
name = "rstrbot-plugin"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bounded out-of-process plugin protocol and reference providers for RstrBot"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "io-std", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
eventsource-stream = "0.2"
url = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "user"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rstrbot-openai"
path = "src/bin/openai.rs"

[[bin]]
name = "rstrbot-diagnostic"
path = "src/bin/diagnostic.rs"

[[bin]]
name = "rstrbot-webhook"
path = "src/bin/webhook.rs"
